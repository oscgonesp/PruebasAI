name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-audio-transcription-EAfHl
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.13113456
            cmake;3.22.1

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Build APK (arm64, release)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             artifacts/PruebasAI-arm64-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PruebasAI-apk
          path: artifacts/PruebasAI-arm64-release.apk
          if-no-files-found: error
          retention-days: 30
